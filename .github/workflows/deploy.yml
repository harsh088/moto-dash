# Builds Moto Dash and publishes it to GitHub Pages on every push to main.
# The TomTom key comes from the repository secret VITE_TOMTOM_API_KEY (never committed).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # On failure, surface npm's error lines as a workflow annotation (readable without the full log).
        run: |
          npm ci --no-audit --no-fund > npm-ci.log 2>&1 || {
            echo "::error title=npm ci failed::$(grep -iE 'npm (error|err)' npm-ci.log | head -25 | tr '\n' ' ')"
            cat npm-ci.log
            exit 1
          }
      - run: npm run build
        env:
          VITE_TOMTOM_API_KEY: ${{ secrets.VITE_TOMTOM_API_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
